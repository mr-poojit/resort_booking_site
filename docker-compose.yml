services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: resort_booking
      POSTGRES_USER: resort
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resort -d resort_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
