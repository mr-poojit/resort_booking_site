name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: resort_booking
          POSTGRES_USER: resort
          POSTGRES_PASSWORD: local-dev-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resort -d resort_booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://resort:local-dev-only@localhost:5432/resort_booking?schema=public
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --accept-data-loss
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
